server:
  port: 8000

spring:
  datasource:
    url: jdbc:mysql://db:3306/bookstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

mybatis:
  type-aliases-package: com.example.bookstore.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.example.bookstore: INFO
